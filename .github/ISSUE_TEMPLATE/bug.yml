name: "🐛 Bug"
description: Algo quebrou ou se comportou de forma inesperada.
labels: ["bug"]
body:
  - type: textarea
    id: descricao
    attributes:
      label: O que aconteceu?
      description: Descreva o problema e o que você esperava que acontecesse.
    validations:
      required: true
  - type: textarea
    id: reproducao
    attributes:
      label: Como reproduzir
      placeholder: |
        1. `autodiag scan --demo`
        2. ...
    validations:
      required: true
  - type: input
    id: ambiente
    attributes:
      label: Ambiente
      placeholder: "ex.: Windows 11, Python 3.12, autodiag 0.3.0 (pip show autodiag)"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs/saída (opcional)
      render: text
