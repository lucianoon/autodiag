name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Verify tag matches package version
        shell: bash
        run: |
          package_version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          if [ "v${package_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package version ${package_version}."
            exit 1
          fi

      - name: Run quality gates
        run: |
          uv sync --locked
          uv run ruff check .
          uv run mypy
          uv run pytest -q

      - name: Build wheel and source distribution
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/autodiag/
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

      # Falha antes de subir nada quando o secret não está configurado, em vez
      # de deixar o erro aparecer como recusa de autenticação do PyPI.
      - name: Verify the PyPI token is configured
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "${PYPI_API_TOKEN}" ]; then
            echo "::error::Secret PYPI_API_TOKEN ausente. Cadastre em Settings > Secrets and variables > Actions."
            exit 1
          fi

      # Autenticação por token de API. Trusted publishing é preferível — não
      # exige segredo de longa duração no repositório — e para voltar a ele
      # basta remover o bloco `with:` e devolver `permissions: id-token: write`
      # ao job, depois de cadastrar o publisher em pypi.org.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
