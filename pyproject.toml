[project]
name = "autodiag"
version = "0.1.0"
description = "Diagnóstico OBD2 universal para veículos 2015+"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "pyserial>=3.5",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]

[project.scripts]
autodiag = "autodiag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autodiag"]
