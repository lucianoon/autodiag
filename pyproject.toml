[project]
name = "autodiag"
version = "0.3.0"
description = "Diagnóstico OBD2 universal para veículos 2015+"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Luciano de Oliveira Nunes" }]
keywords = ["obd2", "elm327", "diagnostico", "automotive", "dtc", "can"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: Portuguese (Brazilian)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "pyserial>=3.5",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
# Backend OpenAI-compatible: OpenAI, OpenRouter, Groq, Together, vLLM,
# Ollama, LM Studio. Não é necessário para o backend Anthropic nativo.
openai = ["openai>=1.40.0"]

[project.urls]
Repository = "https://github.com/lucianoon/autodiag"
Issues = "https://github.com/lucianoon/autodiag/issues"
Changelog = "https://github.com/lucianoon/autodiag/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
script-files = ["scripts/autodiag"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autodiag = ["web/static/*.html"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.9",
    "mypy>=1.14",
    "types-pyserial>=3.5",
    # Instalado no dev para que o mypy type-cheque o backend OpenAI-compatible;
    # em runtime continua sendo o extra opcional [openai].
    "openai>=1.40.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# load_dotenv() precisa rodar antes dos imports do pacote
"src/autodiag/cli.py" = ["E402"]
"src/autodiag/web/server.py" = ["E402"]
# tabela de dados de DTCs: legibilidade > limite de coluna
"src/autodiag/core/dtc.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
