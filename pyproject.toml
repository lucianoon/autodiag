[project]
name = "autodiag"
version = "0.1.0"
description = "Diagnóstico OBD2 universal para veículos 2015+"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "pyserial>=3.5",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]

[project.scripts]
autodiag = "autodiag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autodiag"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.9",
    "mypy>=1.14",
    "types-pyserial>=3.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# load_dotenv() precisa rodar antes dos imports do pacote
"src/autodiag/cli.py" = ["E402"]
"src/autodiag/web/server.py" = ["E402"]
# tabela de dados de DTCs: legibilidade > limite de coluna
"src/autodiag/core/dtc.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
