<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoDiag OBD2</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #0d1117; color: #e6edf3; }
    .card { background: #161b22; border-color: #30363d; }
    .nav-tabs .nav-link { color: #8b949e; border-color: transparent; }
    .nav-tabs .nav-link.active { color: #e6edf3; background: #161b22; border-color: #30363d #30363d #161b22; }
    .table { color: #e6edf3; }
    .table thead th { color: #8b949e; font-weight: 500; font-size: 12px; text-transform: uppercase; border-color: #21262d; }
    .table td { border-color: #21262d; vertical-align: middle; }
    .log-box {
      background: #010409;
      border: 1px solid #30363d;
      border-radius: 6px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 13px;
      height: 180px;
      overflow-y: auto;
      padding: 12px 14px;
      line-height: 1.7;
    }
    .log-ok   { color: #3fb950; }
    .log-warn { color: #d29922; }
    .log-err  { color: #f85149; }
    .log-info { color: #58a6ff; }
    .progress { background: #21262d; }
    .form-control, .form-select {
      background: #0d1117;
      border-color: #30363d;
      color: #e6edf3;
    }
    .form-control:focus {
      background: #0d1117;
      border-color: #58a6ff;
      color: #e6edf3;
      box-shadow: 0 0 0 3px rgba(88,166,255,.15);
    }
    .form-control::placeholder { color: #484f58; }
    code { color: #e3b341; }
    .navbar { background: #161b22 !important; border-bottom: 1px solid #30363d; }
    .stat-card .val { font-size: 2.5rem; font-weight: 700; line-height: 1; }
    .analysis-box {
      white-space: pre-wrap;
      font-size: 14px;
      line-height: 1.7;
      background: #010409;
      border-radius: 6px;
      padding: 16px;
      border: 1px solid #30363d;
    }
  </style>
</head>
<body>

<nav class="navbar px-4 py-2">
  <span class="fw-bold" style="color:#58a6ff; font-size:1.1rem; letter-spacing:.5px;">◈ AutoDiag OBD2</span>
  <span class="text-muted small" id="last-scan-label"></span>
</nav>

<div class="container-fluid px-4 py-3" style="max-width:1200px">

  <ul class="nav nav-tabs mb-4" id="mainTabs">
    <li class="nav-item"><a class="nav-link active" data-bs-toggle="tab" href="#tab-dash">Dashboard</a></li>
    <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#tab-scan">Scan</a></li>
    <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#tab-hist">Histórico</a></li>
    <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#tab-dtc">DTC</a></li>
  </ul>

  <div class="tab-content">

    <!-- ── Dashboard ─────────────────────────────────────── -->
    <div class="tab-pane fade show active" id="tab-dash">
      <div class="row g-3" id="dash-content">
        <div class="col-12 text-muted text-center py-5">Carregando...</div>
      </div>
    </div>

    <!-- ── Scan ───────────────────────────────────────────── -->
    <div class="tab-pane fade" id="tab-scan">
      <div class="row g-3">

        <div class="col-12">
          <div class="card">
            <div class="card-body py-2">
              <div class="row g-2 align-items-end">
                <div class="col-md-4">
                  <label class="form-label text-muted small mb-1">Porta ELM327</label>
                  <input type="text" class="form-control form-control-sm" id="scan-port"
                    placeholder="/dev/cu.usbserial-... (autodetectar)">
                </div>
                <div class="col-md-3">
                  <label class="form-label text-muted small mb-1">Wi-Fi host</label>
                  <input type="text" class="form-control form-control-sm" id="scan-wifi"
                    placeholder="ex: 192.168.0.10">
                </div>
                <div class="col-md-2 d-flex flex-column justify-content-center pt-3">
                  <div class="d-flex align-items-center gap-2">
                    <input type="checkbox" class="form-check-input mt-0" id="scan-no-ai">
                    <label class="form-check-label small text-muted" for="scan-no-ai">Sem análise IA</label>
                  </div>
                  <div class="d-flex align-items-center gap-2">
                    <input type="checkbox" class="form-check-input mt-0" id="scan-demo">
                    <label class="form-check-label small text-muted" for="scan-demo">Modo demo</label>
                  </div>
                </div>
                <div class="col-md-3">
                  <button class="btn btn-primary btn-sm w-100" id="scan-btn" onclick="startScan()">
                    ▶ Iniciar Scan
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="col-12">
          <div class="log-box" id="scan-log">
            <span class="text-muted">Pronto. Configure a porta e clique em "Iniciar Scan".</span>
          </div>
        </div>

        <div class="col-md-6" id="scan-dtcs-card" style="display:none">
          <div class="card h-100">
            <div class="card-header small text-muted py-2">DTCs encontrados</div>
            <div class="card-body p-0">
              <table class="table table-sm mb-0" id="scan-dtcs-table">
                <thead><tr><th>Código</th><th>Descrição</th><th>Urgência</th></tr></thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        </div>

        <div class="col-md-6" id="scan-pids-card" style="display:none">
          <div class="card h-100">
            <div class="card-header small text-muted py-2">PIDs ao vivo</div>
            <div class="card-body" id="scan-pids-body"></div>
          </div>
        </div>

        <div class="col-12" id="scan-analysis-card" style="display:none">
          <div class="card">
            <div class="card-header small text-muted py-2">Análise IA (Claude)</div>
            <div class="card-body p-3">
              <div class="analysis-box" id="scan-analysis-text"></div>
            </div>
          </div>
        </div>

      </div>
    </div>

    <!-- ── Histórico ──────────────────────────────────────── -->
    <div class="tab-pane fade" id="tab-hist">
      <div class="card">
        <div class="card-body p-0">
          <table class="table table-sm table-hover mb-0" id="hist-table">
            <thead>
              <tr>
                <th>#</th><th>Data</th><th>Veículo</th><th>DTCs</th><th>Urgência</th><th>KM</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- ── DTC Lookup ─────────────────────────────────────── -->
    <div class="tab-pane fade" id="tab-dtc">
      <div class="row g-3">
        <div class="col-md-5">
          <div class="input-group">
            <input type="text" class="form-control" id="dtc-input"
              placeholder="Digite o código ou descrição (ex: P0171)"
              oninput="searchDTC(this.value)"
              onkeydown="if(event.key==='Enter') lookupDTC()">
            <button class="btn btn-outline-secondary" onclick="lookupDTC()">Consultar</button>
          </div>
        </div>
      </div>
      <div class="mt-3" id="dtc-result"></div>
      <div class="mt-2" id="dtc-search-results"></div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>

// ── helpers ──────────────────────────────────────────────────────────────────

const SEV = { critico: 'danger', atencao: 'warning', informativo: 'info' };
const sevBadge = s => `<span class="badge bg-${SEV[s]||'secondary'}">${s||'—'}</span>`;

function pidBar(val, max, color) {
  const pct = Math.min(100, Math.max(0, (Math.abs(val) / max) * 100));
  return `<div class="progress mb-1" style="height:6px">
    <div class="progress-bar bg-${color}" style="width:${pct}%"></div>
  </div>`;
}

function renderPIDs(pids) {
  const META = [
    ['rpm',               'RPM',                'rpm',  5500, null, 600  ],
    ['speed_kmh',         'Velocidade',          'km/h', 200,  null, null ],
    ['coolant_temp_c',    'Temp. motor',         '°C',   120,  105,  null ],
    ['intake_temp_c',     'Temp. admissão',      '°C',   80,   null, null ],
    ['throttle_pct',      'Borboleta',           '%',    100,  null, null ],
    ['maf_g_s',           'MAF',                 'g/s',  20,   null, 2.0  ],
    ['fuel_trim_short_b1','Fuel trim curto B1',  '%',    30,   15,   null ],
    ['fuel_trim_long_b1', 'Fuel trim longo B1',  '%',    30,   10,   null ],
    ['o2_b1s1_v',         'O2 B1S1',             'V',    1.0,  null, 0.1  ],
    ['fuel_level_pct',    'Nível combustível',   '%',    100,  null, 10   ],
  ];
  let html = '';
  for (const [key, label, unit, max, hi, lo] of META) {
    const val = pids[key];
    if (val == null) continue;
    const color = (hi && Math.abs(val) > hi) ? 'danger'
                : (lo && val < lo) ? 'warning' : 'success';
    html += `<div class="mb-2">
      <div class="d-flex justify-content-between" style="font-size:12px; color:#8b949e; margin-bottom:3px;">
        <span>${label}</span><span>${val} ${unit}</span>
      </div>
      ${pidBar(val, max, color)}
    </div>`;
  }
  return html || '<span class="text-muted small">Sem dados</span>';
}

// ── log ──────────────────────────────────────────────────────────────────────

function logClear() { document.getElementById('scan-log').innerHTML = ''; }
function logLine(msg, cls = 'log-info') {
  const el = document.getElementById('scan-log');
  el.innerHTML += `<div class="${cls}">▸ ${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}

// ── dashboard ─────────────────────────────────────────────────────────────────

async function loadDash() {
  const [sumRes, histRes] = await Promise.all([
    fetch('/api/summary'), fetch('/api/history?limit=1')
  ]);
  const sum = await sumRes.json();
  const hist = await histRes.json();
  const last = hist[0];

  let html = `
    <div class="col-sm-4">
      <div class="card stat-card text-center py-3">
        <div class="text-muted small mb-1">Total de diagnósticos</div>
        <div class="val text-primary">${sum.total}</div>
      </div>
    </div>
    <div class="col-sm-4">
      <div class="card stat-card text-center py-3">
        <div class="text-muted small mb-1">Críticos</div>
        <div class="val text-danger">${sum.critical}</div>
      </div>
    </div>`;

  if (sum.top_dtcs && sum.top_dtcs.length) {
    html += `<div class="col-sm-4">
      <div class="card h-100 py-3 px-3">
        <div class="text-muted small mb-2">DTCs mais frequentes</div>
        ${sum.top_dtcs.map(([code, cnt]) =>
          `<div class="d-flex justify-content-between small">
            <code>${code}</code>
            <span class="text-muted">${cnt}x</span>
          </div>`
        ).join('')}
      </div>
    </div>`;
  }

  if (last) {
    const color = SEV[last.urgency] || 'secondary';
    const dtcsHtml = (last.dtc_codes || []).map(c =>
      `<code class="me-2 text-warning">${c}</code>`
    ).join('') || '<span class="text-muted">Nenhum</span>';
    const preview = (last.diagnosis || '').slice(0, 500);
    html += `<div class="col-12">
      <div class="card" style="border-left: 3px solid var(--bs-${color})">
        <div class="card-header small text-muted py-2 d-flex justify-content-between">
          <span>Último diagnóstico</span><span>${last.ts}</span>
        </div>
        <div class="card-body">
          <div class="mb-2 d-flex align-items-center gap-2">
            <strong>${last.vehicle_label || 'Veículo desconhecido'}</strong>
            ${sevBadge(last.urgency)}
          </div>
          <div class="mb-3">${dtcsHtml}</div>
          ${preview ? `<div class="analysis-box" style="max-height:200px;overflow:auto">${preview}${last.diagnosis.length>500?'…':''}</div>` : ''}
        </div>
      </div>
    </div>`;
    document.getElementById('last-scan-label').textContent = `Último scan: ${last.ts}`;
  } else {
    html += `<div class="col-12 text-center text-muted py-4">
      Nenhum diagnóstico ainda. Vá para <strong>Scan</strong> para começar.
    </div>`;
  }

  document.getElementById('dash-content').innerHTML = html;
}

// ── scan ──────────────────────────────────────────────────────────────────────

let scanActive = false;

function startScan() {
  if (scanActive) return;
  logClear();
  ['scan-dtcs-card','scan-pids-card','scan-analysis-card'].forEach(id =>
    document.getElementById(id).style.display = 'none'
  );

  const port  = document.getElementById('scan-port').value.trim();
  const wifi  = document.getElementById('scan-wifi').value.trim();
  const noAi  = document.getElementById('scan-no-ai').checked;
  const demo  = document.getElementById('scan-demo').checked;
  const btn   = document.getElementById('scan-btn');

  const params = new URLSearchParams();
  if (port)  params.set('port', port);
  if (wifi)  params.set('wifi', wifi);
  if (noAi)  params.set('no_ai', 'true');
  if (demo)  params.set('demo', 'true');

  btn.disabled = true;
  btn.textContent = '⏳ Escaneando...';
  scanActive = true;

  const es = new EventSource(`/api/scan/stream?${params}`);

  es.onmessage = e => {
    const ev = JSON.parse(e.data);

    if (ev.type === 'status')  logLine(ev.message);
    if (ev.type === 'warn')    logLine(ev.message, 'log-warn');
    if (ev.type === 'error')   logLine('ERRO: ' + ev.message, 'log-err');
    if (ev.type === 'vin')     logLine(`VIN: ${ev.vin} → ${ev.vehicle}`, 'log-ok');

    if (ev.type === 'dtcs') {
      const n = ev.dtcs.length;
      logLine(`${n} DTC(s) encontrado(s)`, n ? 'log-warn' : 'log-ok');
      document.querySelector('#scan-dtcs-table tbody').innerHTML = n
        ? ev.dtcs.map(d => `<tr>
            <td><code>${d.code}</code></td>
            <td class="small">${d.description}</td>
            <td>${sevBadge(d.severity)}</td>
          </tr>`).join('')
        : '<tr><td colspan="3" class="text-muted text-center small py-2">Nenhum DTC</td></tr>';
      document.getElementById('scan-dtcs-card').style.display = '';
    }

    if (ev.type === 'pids') {
      document.getElementById('scan-pids-body').innerHTML = renderPIDs(ev.pids);
      document.getElementById('scan-pids-card').style.display = '';
    }

    if (ev.type === 'analysis') {
      document.getElementById('scan-analysis-text').textContent = ev.text;
      document.getElementById('scan-analysis-card').style.display = '';
    }

    if (ev.type === 'saved') {
      logLine(`Diagnóstico #${ev.session_id} salvo — urgência: ${ev.urgency}`, 'log-ok');
    }

    if (ev.type === 'done' || ev.type === 'error') {
      es.close();
      btn.disabled = false;
      btn.textContent = '▶ Iniciar Scan';
      scanActive = false;
      if (ev.type === 'done') loadDash();
    }
  };

  es.onerror = () => {
    logLine('Conexão perdida com o servidor.', 'log-err');
    es.close();
    btn.disabled = false;
    btn.textContent = '▶ Iniciar Scan';
    scanActive = false;
  };
}

// ── histórico ─────────────────────────────────────────────────────────────────

async function loadHistory() {
  const rows = await fetch('/api/history?limit=30').then(r => r.json());
  const tbody = document.querySelector('#hist-table tbody');
  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="6" class="text-muted text-center py-3">Nenhum diagnóstico registrado.</td></tr>';
    return;
  }
  tbody.innerHTML = rows.map(s => {
    const color = SEV[s.urgency] || 'secondary';
    const dtcs = (s.dtc_codes || []).map(c => `<code class="me-1 text-warning">${c}</code>`).join('') || '—';
    return `<tr>
      <td class="text-muted small">#${s.id}</td>
      <td class="small">${s.ts}</td>
      <td class="small">${s.vehicle_label || '—'}</td>
      <td>${dtcs}</td>
      <td>${sevBadge(s.urgency)}</td>
      <td class="text-muted small">${s.km || '—'}</td>
    </tr>`;
  }).join('');
}

// ── DTC lookup ────────────────────────────────────────────────────────────────

let _searchT;
function searchDTC(val) {
  clearTimeout(_searchT);
  document.getElementById('dtc-result').innerHTML = '';
  if (val.length < 2) { document.getElementById('dtc-search-results').innerHTML = ''; return; }
  _searchT = setTimeout(async () => {
    const results = await fetch(`/api/dtc?q=${encodeURIComponent(val)}`).then(r => r.json());
    document.getElementById('dtc-search-results').innerHTML = results.length
      ? results.map(d => `
          <div class="d-flex align-items-center gap-2 py-2 border-bottom border-secondary"
               style="cursor:pointer" onclick="showDTCInfo('${d.code}')">
            <code>${d.code}</code>
            <span class="small flex-grow-1">${d.description}</span>
            ${sevBadge(d.severity)}
          </div>`).join('')
      : '<div class="text-muted small mt-2">Nenhum resultado.</div>';
  }, 280);
}

async function lookupDTC() {
  const code = document.getElementById('dtc-input').value.trim().toUpperCase();
  if (code) showDTCInfo(code);
}

async function showDTCInfo(code) {
  document.getElementById('dtc-input').value = code;
  document.getElementById('dtc-search-results').innerHTML = '';
  const res = await fetch(`/api/dtc/${code}`);
  const el = document.getElementById('dtc-result');
  if (!res.ok) {
    el.innerHTML = `<div class="alert alert-secondary">DTC ${code} não encontrado na base local.</div>`;
    return;
  }
  const d = await res.json();
  const color = SEV[d.severity] || 'secondary';
  el.innerHTML = `
    <div class="card mt-2" style="border-left:3px solid var(--bs-${color})">
      <div class="card-header d-flex align-items-center gap-2 py-2">
        <code class="fs-5">${d.code}</code>
        ${sevBadge(d.severity)}
        <span class="text-muted small ms-auto">${d.system}</span>
      </div>
      <div class="card-body">
        <p class="mb-3">${d.description}</p>
        <div class="text-muted small mb-1">Causas prováveis:</div>
        <ul class="mb-0 small">${(d.causes||[]).map(c=>`<li>${c}</li>`).join('')}</ul>
      </div>
    </div>`;
}

// ── tab events ────────────────────────────────────────────────────────────────

document.querySelectorAll('[data-bs-toggle="tab"]').forEach(el => {
  el.addEventListener('shown.bs.tab', e => {
    const t = e.target.getAttribute('href');
    if (t === '#tab-hist') loadHistory();
    if (t === '#tab-dash') loadDash();
  });
});

loadDash();
</script>
</body>
</html>
